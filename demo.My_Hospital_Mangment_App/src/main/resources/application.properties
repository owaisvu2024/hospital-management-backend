spring.application.name=demo.My_Hospital_Mangment_App

# 🌟 Environment Variables with Local Fallbacks
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Hospital_Managment_App?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:12345}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Render ke liye dynamic port configuration (agar PORT na mile toh 8090 use karega)
server.port=${PORT:8090}